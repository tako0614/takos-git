<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- No CSP <meta>: the worker is the single, code-reviewed source of the CSP. -->
    <title>Takos Git</title>
    <meta
      name="description"
      content="Collaborative Git hosting — standard clone, fetch, and push on top of an R2 data plane."
    />
    <script src="/theme-init.js"></script>
    <style>
      /* Pre-hydration flash guard — must match styles.css --canvas-default /
         --fg-default (light + dark). */
      html,
      body {
        margin: 0;
        color-scheme: light;
        background: #ffffff;
        color: #1f2328;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        color-scheme: dark;
        background: #0d1117;
        color: #f0f6fc;
      }
    </style>
    <link rel="icon" href="/icons/takos-git.svg" />
    <!-- Home-screen install: same-origin manifest + PNG icons (web/public). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
